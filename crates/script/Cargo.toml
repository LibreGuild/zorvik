[package]
name = "zorvik-script"
description = "JavaScript scripts for Zorvik: sandboxed QuickJS with a Postman-compatible pm API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
# Without assertions like quickjs-ng's own release builds: an out-of-memory
# error in some built-ins leaks an object, and the leak check on freeing the
# runtime would abort the whole app (docs/architecture.md, "Scripts").
rquickjs = { workspace = true, features = ["disable-assertions"] }
serde.workspace = true
serde_json.workspace = true
ts-rs.workspace = true
