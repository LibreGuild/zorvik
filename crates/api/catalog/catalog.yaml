# The API catalog shipped with Zorvik (see crates/api/src/catalog.rs for the fields).
# Descriptions are downloaded from their publishers when a user imports them; nothing here is
# fetched unasked. Keep entries sorted by category, then name. Check every download with
# `cargo test -p zorvik-api --test catalog_live -- --ignored` (docs/testing.md).

# ---- AI ------------------------------------------------------------------------------------

- id: aws-bedrock
  name: Amazon Bedrock
  category: ai
  description: Foundation models, custom models, guardrails and inference profiles on AWS.
  website: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_Operations_Amazon_Bedrock.html
  auth: AWS Signature (access key ID and secret access key)
  format: AWS Smithy
  license:
    name: Apache-2.0
    url: https://github.com/aws/api-models-aws/blob/main/LICENSE
  source:
    type: download
    url: https://raw.githubusercontent.com/aws/api-models-aws/main/models/bedrock/service/2023-04-20/bedrock-2023-04-20.json
  first: ListFoundationModels

- id: aws-bedrock-runtime
  name: Amazon Bedrock Runtime
  category: ai
  description: Run foundation models on AWS with Converse, InvokeModel and streaming.
  website: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_Operations_Amazon_Bedrock_Runtime.html
  auth: AWS Signature (access key ID and secret access key)
  format: AWS Smithy
  license:
    name: Apache-2.0
    url: https://github.com/aws/api-models-aws/blob/main/LICENSE
  source:
    type: download
    url: https://raw.githubusercontent.com/aws/api-models-aws/main/models/bedrock-runtime/service/2023-09-30/bedrock-runtime-2023-09-30.json
  first: Converse

- id: anthropic
  name: Anthropic
