# Weekly dependency updates: one pull request per ecosystem for minor and patch
# updates, and one for major updates (which may need code changes).
# Security updates are separate and immediate (repository settings).
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies", "rust"]
    groups:
      rust:
        update-types: ["minor", "patch"]
      rust-major:
        update-types: ["major"]

  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies", "javascript"]
    ignore:
      # Types follow the Node.js version CI and contributors use (22 LTS).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # The GraphQL editor (cm6-graphql) bundles graphql 16; two majors can't share schemas.
      - dependency-name: "graphql"
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        update-types: ["minor", "patch"]
      npm-major:
        update-types: ["major"]

  - package-ecosystem: npm
    directory: /docs/pages
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies", "website"]
    groups:
      website:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies", "github-actions"]
    groups:
      actions:
        patterns: ["*"]
