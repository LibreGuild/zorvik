# Weekly dependency updates, grouped so each ecosystem opens one pull request.
# Security updates are separate and immediate (repository settings).
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies", "rust"]
    groups:
      rust:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies", "javascript"]
    groups:
      npm:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies", "github-actions"]
    groups:
      actions:
        patterns: ["*"]
