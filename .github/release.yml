# Sections of the release notes GitHub writes from merged pull requests (by label).
changelog:
  exclude:
    labels: ["skip changelog"]
  categories:
    - title: Breaking changes
      labels: ["breaking"]
    - title: New features
      labels: ["enhancement"]
    - title: Fixes
      labels: ["bug"]
    - title: Security
      labels: ["security"]
    - title: Documentation
      labels: ["documentation"]
    - title: Dependencies
      labels: ["dependencies"]
    - title: Other changes
      labels: ["*"]
