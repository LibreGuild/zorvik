name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only by default; only the release job gets write access.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  ZORVIK_TEST_TRASH: "1"

jobs:
  rust-linux:
    name: Rust (Linux) — fmt, clippy, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        env:
          ZORVIK_TEST_TRASH: ""
        run: cargo test --no-fail-fast
      - name: Generated files are up to date
        # The TypeScript bindings and the dynamic variables reference are written by the tests.
        # `add -N` makes newly generated (untracked) binding files show up in the diff too.
        run: |
          git add -N app/src/bindings
          git diff --exit-code -- app/src/bindings docs/pages/src/content/docs/docs/variables/dynamic-variables.md

  rust-windows:
    name: Rust (Windows) — tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: cargo test --no-fail-fast

  ui:
    name: UI — typecheck, unit tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: E2E (Playwright + real backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build dev bridge, test server and CLI (AI agent tests run `zorvik mcp`)
        run: cargo build -p zorvik-devbridge -p zorvik-testkit -p zorvik-cli
      - name: Install UI deps
        working-directory: app
        run: npm ci && npx playwright install --with-deps chromium
      - name: Run E2E
        working-directory: app
        run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        continue-on-error: true
        with:
          name: playwright-report
          path: app/playwright-report
          retention-days: 7

  # ---- releases ------------------------------------------------------------------------------------
  # A `v*` tag publishes that version (it must match the version in the code). A run started by hand
  # (or by `nightly.yml`, once a day when `main` changed) replaces the "nightly" pre-release; a
  # plain push to `main` only runs the checks. The builds upload to a draft of this run; `publish`
  # makes it public only when all of them succeeded, so a failed build never replaces a release. A
  # run only ever touches its own draft: a tag and a nightly can build at the same time.

  release-draft:
    name: Start the release
    needs: [rust-linux, rust-windows, ui, e2e]
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' &&
        (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      channel: ${{ steps.channel.outputs.channel }}
      version: ${{ steps.channel.outputs.version }}
      built_at: ${{ steps.channel.outputs.built_at }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Channel and version
        id: channel
        run: |
          set -euo pipefail
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          for file in app/package.json app/src-tauri/tauri.conf.json; do
            other=$(jq -r .version "$file")
            if [ "$other" != "$version" ]; then
              echo "::error file=$file::version $other differs from Cargo.toml ($version)"
              exit 1
            fi
          done
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match the version in the code ($version)"
              exit 1
            fi
            echo "channel=stable" >> "$GITHUB_OUTPUT"
          else
            echo "channel=nightly" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # One time for the whole run: the builds carry it and latest.json announces it, so a
          # nightly never counts as newer than itself.
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Create the draft
        run: |
          gh release create "build-${{ github.run_number }}" --draft --target "$GITHUB_SHA" \
            --title "Zorvik build ${{ github.run_number }}" --notes "Building…"

  build-windows:
    name: Build Windows (installer, portable, CLI)
    needs: release-draft
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      # Shown in Settings next to the version (nightly builds only).
      ZORVIK_BUILD: ${{ needs.release-draft.outputs.channel == 'nightly' && format('nightly {0} · {1}', github.run_number, github.sha) || '' }}
      ZORVIK_BUILT_AT: ${{ needs.release-draft.outputs.built_at }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Keep the write token out of .git/config while npm/cargo build scripts run.
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install UI deps
        working-directory: app
        run: npm ci
      - name: Build the app with the CLI inside
        working-directory: app
        shell: bash
        run: |
          rm -rf ../target/release/bundle
          npm run package -- --bundles nsis
      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $nsis = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          Copy-Item $nsis.FullName dist/Zorvik-Windows-Setup-x64.exe
          New-Item -ItemType Directory -Force portable | Out-Null
          Copy-Item "target/release/zorvik-desktop.exe" "portable/zorvik-desktop.exe"
          Copy-Item "target/release/zorvik.exe" "portable/zorvik.exe"
          Compress-Archive -Path portable/* -DestinationPath dist/Zorvik-Windows-Portable-x64.zip
          # The command line on its own, for CI machines and servers.
          New-Item -ItemType Directory -Force cli | Out-Null
          Copy-Item "target/release/zorvik.exe", "LICENSE-MIT", "LICENSE-APACHE" cli/
          Compress-Archive -Path cli/* -DestinationPath dist/zorvik-cli-windows-x64.zip
          Get-ChildItem dist | Format-Table Name, Length
      - name: Upload to the draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "build-${{ github.run_number }}" dist/* --clobber

  build-macos:
    name: Build macOS (universal DMG, CLI)
    needs: release-draft
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      ZORVIK_BUILD: ${{ needs.release-draft.outputs.channel == 'nightly' && format('nightly {0} · {1}', github.run_number, github.sha) || '' }}
      ZORVIK_BUILT_AT: ${{ needs.release-draft.outputs.built_at }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install UI deps
        working-directory: app
        run: npm ci
      - name: Build the app with the CLI inside (Apple silicon + Intel)
        working-directory: app
        run: |
          rm -rf ../target/universal-apple-darwin/release/bundle
          npm run package -- --target universal-apple-darwin --bundles app,dmg
      - name: Collect
        run: |
          mkdir -p dist
          cp target/universal-apple-darwin/release/bundle/dmg/*.dmg dist/Zorvik-macOS-universal.dmg
          # What the updater installs (signed later, in sign-updates): the app with Zorvik.app at
          # the root, without macOS metadata files, which would break its code signature.
          COPYFILE_DISABLE=1 tar --no-mac-metadata -czf dist/Zorvik-macOS-universal.app.tar.gz \
            -C target/universal-apple-darwin/release/bundle/macos Zorvik.app
          # The command line on its own (Apple silicon and Intel), for CI machines and servers.
          mkdir -p cli
          cp app/src-tauri/binaries/zorvik-universal-apple-darwin cli/zorvik
          cp LICENSE-MIT LICENSE-APACHE cli/
          tar -czf dist/zorvik-cli-macos-universal.tar.gz -C cli zorvik LICENSE-MIT LICENSE-APACHE
          ls -l dist
      - name: Upload to the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "build-${{ github.run_number }}" dist/* --clobber

  build-linux:
    name: Build Linux (deb, rpm, AppImage, CLI)
    needs: release-draft
    # The oldest supported Ubuntu: packages built here run on newer systems (glibc).
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      ZORVIK_BUILD: ${{ needs.release-draft.outputs.channel == 'nightly' && format('nightly {0} · {1}', github.run_number, github.sha) || '' }}
      ZORVIK_BUILT_AT: ${{ needs.release-draft.outputs.built_at }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: System libraries (WebKitGTK and friends)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf file
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install UI deps
        working-directory: app
        run: npm ci
      - name: Build the app with the CLI inside
        working-directory: app
        run: |
          rm -rf ../target/release/bundle
          npm run package -- --bundles deb,rpm,appimage
      - name: Collect
        run: |
          mkdir -p dist
          cp target/release/bundle/deb/*.deb dist/Zorvik-Linux-amd64.deb
          cp target/release/bundle/rpm/*.rpm dist/Zorvik-Linux-x86_64.rpm
          cp target/release/bundle/appimage/*.AppImage dist/Zorvik-Linux-x86_64.AppImage
          # The command line on its own, for CI machines and servers (built on the oldest supported glibc).
          mkdir -p cli
          cp target/release/zorvik LICENSE-MIT LICENSE-APACHE cli/
          tar -czf dist/zorvik-cli-linux-x86_64.tar.gz -C cli zorvik LICENSE-MIT LICENSE-APACHE
          ls -l dist
      - name: Upload to the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "build-${{ github.run_number }}" dist/* --clobber

  # The updater key is used only here: a short job in the `release` environment, which only `main`
  # and `v*` tags may use (Settings → Environments), with no build scripts or dependencies of the
  # app running next to it. It signs the three files the app's updater installs and writes
  # latest.json, the file the app reads (docs/ci-release.md, "Updates").
  sign-updates:
    name: Sign the updates
    needs: [release-draft, build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CHANNEL: ${{ needs.release-draft.outputs.channel }}
      VERSION: ${{ needs.release-draft.outputs.version }}
      BUILT_AT: ${{ needs.release-draft.outputs.built_at }}
      DRAFT: build-${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Download what the updater installs
        run: |
          set -euo pipefail
          mkdir -p updates
          gh release download "$DRAFT" --dir updates \
            --pattern Zorvik-Windows-Setup-x64.exe --pattern Zorvik-macOS-universal.app.tar.gz --pattern Zorvik-Linux-x86_64.AppImage
          ls -l updates
      - name: Sign and write latest.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # The signer, pinned to the version the app is built with; no install scripts run.
          npm_config_ignore_scripts: "true"
        run: |
          set -euo pipefail
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::warning::No updater key in the release environment: this release has no automatic updates (docs/ci-release.md)."
            exit 0
          fi
          for file in updates/*; do
            # --app-version binds each signature to this version, so an old file can't pass as new.
            npx --yes @tauri-apps/cli@2.12.0 signer sign --app-version "$VERSION" "$file" > /dev/null
          done
          if [ "$CHANNEL" = stable ]; then
            base="https://github.com/$GH_REPO/releases/download/$GITHUB_REF_NAME"
            notes="Zorvik $VERSION"
          else
            base="https://github.com/$GH_REPO/releases/download/nightly"
            notes="Zorvik nightly (build $GITHUB_RUN_NUMBER)"
          fi
          node .github/scripts/update-manifest.mjs updates "$base" "$VERSION" "$BUILT_AT" "$notes" > latest.json
          cat latest.json
          gh release upload "$DRAFT" latest.json --clobber

  publish:
    name: Publish the release
    needs: [release-draft, sign-updates]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    concurrency:
      group: release-${{ needs.release-draft.outputs.channel }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CHANNEL: ${{ needs.release-draft.outputs.channel }}
      VERSION: ${{ needs.release-draft.outputs.version }}
      DRAFT: build-${{ github.run_number }}
    steps:
      - name: Release notes
        run: |
          set -euo pipefail
          : > notes.md
          if [ "$CHANNEL" = stable ]; then
            # The tag's message (an annotated tag) opens the notes.
            ref=$(gh api "repos/$GH_REPO/git/ref/tags/$GITHUB_REF_NAME")
            if [ "$(jq -r .object.type <<< "$ref")" = tag ]; then
              gh api "repos/$GH_REPO/git/tags/$(jq -r .object.sha <<< "$ref")" --jq .message >> notes.md
              printf '\n' >> notes.md
            fi
          else
            # shellcheck disable=SC2016 # the backticks are Markdown
            printf 'A preview of what is coming next, built from `main` (build %s, commit %s). For everyday work, use the [latest release](https://github.com/%s/releases/latest).\n\n' \
              "$GITHUB_RUN_NUMBER" "${GITHUB_SHA::7}" "$GH_REPO" >> notes.md
          fi
          cat >> notes.md <<'NOTES'
          ## Downloads
          Each download has the app **and** the `zorvik` command line.

          | System | File | Notes |
          |---|---|---|
          | Windows 10/11 | `Zorvik-Windows-Setup-x64.exe` | Installer for your user (no admin); puts `zorvik` on PATH |
          | Windows 10/11 | `Zorvik-Windows-Portable-x64.zip` | No install: unzip and run `zorvik-desktop.exe` (`zorvik.exe` is beside it) |
          | macOS 11+ (Apple silicon and Intel) | `Zorvik-macOS-universal.dmg` | Drag to Applications. For `zorvik` in a terminal: Settings → AI agents → Add zorvik to PATH |
          | Ubuntu 22.04+ / Debian 12+ | `Zorvik-Linux-amd64.deb` | `sudo apt install ./Zorvik-Linux-amd64.deb` |
          | Fedora / RHEL / openSUSE | `Zorvik-Linux-x86_64.rpm` | `sudo dnf install ./Zorvik-Linux-x86_64.rpm` |
          | Any Linux (x86-64) | `Zorvik-Linux-x86_64.AppImage` | `chmod +x` and run |

          **Only the command line** (for CI machines and servers): `zorvik-cli-windows-x64.zip`, `zorvik-cli-macos-universal.tar.gz`, `zorvik-cli-linux-x86_64.tar.gz`. Unpack and put `zorvik` on your PATH.

          The installed app updates itself from here (Settings → Updates): it only reads this project's release list on GitHub and sends nothing about you. The portable zip, .deb and .rpm tell you when a new version is out.

          The builds are not code-signed yet. **Windows:** if SmartScreen appears, choose **More info → Run anyway**. **macOS:** the first open is blocked; open System Settings → Privacy & Security → **Open Anyway**, or run `xattr -dr com.apple.quarantine /Applications/Zorvik.app`.
          NOTES
          if [ "$CHANNEL" = stable ]; then
            # What changed: merged pull requests since the previous release (.github/release.yml).
            # Compared with the previous version explicitly: the nearest tag may be "nightly".
            prev=$(gh api "repos/$GH_REPO/releases?per_page=100" | jq -r --arg current "$GITHUB_REF_NAME" \
              '[.[] | select((.draft | not) and (.prerelease | not) and (.tag_name | startswith("v")) and .tag_name != $current) | .tag_name] | first // empty')
            if [ -n "$prev" ]; then
              printf '\n' >> notes.md
              gh api "repos/$GH_REPO/releases/generate-notes" -f tag_name="$GITHUB_REF_NAME" -f previous_tag_name="$prev" --jq .body >> notes.md
            fi
          fi
      - name: Publish
        run: |
          set -euo pipefail
          if [ "$CHANNEL" = stable ]; then
            args=(--tag "$GITHUB_REF_NAME" --latest --title "Zorvik $VERSION")
          else
            # Move the "nightly" tag to this commit and replace the previous nightly release.
            gh release delete nightly --yes --cleanup-tag || true
            gh api "repos/$GH_REPO/git/refs" -f ref=refs/tags/nightly -f sha="$GITHUB_SHA" > /dev/null \
              || gh api -X PATCH "repos/$GH_REPO/git/refs/tags/nightly" -f sha="$GITHUB_SHA" -F force=true > /dev/null
            args=(--tag nightly --prerelease --latest=false --title "Zorvik nightly (build $GITHUB_RUN_NUMBER)")
          fi
          # Retried: a transient API error must not leave the draft unpublished.
          for attempt in 1 2 3 4 5; do
            if gh release edit "$DRAFT" "${args[@]}" --draft=false --notes-file notes.md; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1
      - name: Refresh the website
        # The main website is built from the latest release: rebuild it, so it shows this
        # release's docs and version. (A release published with this workflow's token triggers
        # no other workflow by itself.)
        if: env.CHANNEL == 'stable'
        run: gh workflow run pages.yml --ref main || echo "::warning::Could not start the website build"

  discard-draft:
    name: Discard the draft
    # A build failed or the run was cancelled: remove this run's draft (drafts are never public).
    needs: [release-draft, build-windows, build-macos, build-linux, publish]
    if: always() && needs.release-draft.result == 'success' && needs.publish.result != 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Delete the draft
        run: gh release delete "build-${{ github.run_number }}" --yes || true
