name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only by default; only the release job gets write access.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  ZORVIK_TEST_TRASH: "1"

jobs:
  rust-linux:
    name: Rust (Linux) — fmt, clippy, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        env:
          ZORVIK_TEST_TRASH: ""
        run: cargo test --no-fail-fast
      - name: Generated files are up to date
        # The TypeScript bindings and the dynamic variables reference are written by the tests.
        # `add -N` makes newly generated (untracked) binding files show up in the diff too.
        run: |
          git add -N app/src/bindings
          git diff --exit-code -- app/src/bindings docs/pages/src/content/docs/docs/variables/dynamic-variables.md

  code-export:
    name: Code export — toolchains
    # Every language "Copy as cURL or code" writes, checked by its own compiler or parser
    # (the runner has Node, Python, Go, Java, .NET, PHP, Ruby, Rust, C, PowerShell and bash).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: libcurl headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev
      - name: Generated code compiles
        run: cargo test -p zorvik-formats snippet_syntax -- --ignored --nocapture

  rust-windows:
    name: Rust (Windows) — tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: cargo test --no-fail-fast

  ui:
    name: UI — typecheck, unit tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: E2E (Playwright + real backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build dev bridge, test server and CLI (AI agent tests run `zorvik mcp`)
        run: cargo build -p zorvik-devbridge -p zorvik-testkit -p zorvik-cli
      - name: Install UI deps
        working-directory: app
        run: npm ci && npx playwright install --with-deps chromium
      - name: Run E2E
        working-directory: app
        run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        continue-on-error: true
        with:
          name: playwright-report
          path: app/playwright-report
          retention-days: 7

  # ---- releases ------------------------------------------------------------------------------------
  # A `v*` tag publishes that version (it must match the version in the code); a run started by
  # hand on such a tag builds it again. Everything else (a push to `main`, a pull request, a run
  # started by hand on a branch) only runs the checks. The builds upload to a draft of this run;
  # `publish` makes it public only when all of them succeeded, so a failed build never replaces a
  # release. A run only ever touches its own draft.

  release-draft:
    name: Start the release
    needs: [rust-linux, rust-windows, ui, e2e, code-export]
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      built_at: ${{ steps.version.outputs.built_at }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Version
        id: version
        run: |
          set -euo pipefail
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          for file in app/package.json app/src-tauri/tauri.conf.json; do
            other=$(jq -r .version "$file")
            if [ "$other" != "$version" ]; then
              echo "::error file=$file::version $other differs from Cargo.toml ($version)"
              exit 1
            fi
          done
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the version in the code ($version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # The release's date in latest.json.
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Create the draft
        run: |
          gh release create "build-${{ github.run_number }}" --draft --target "$GITHUB_SHA" \
            --title "Zorvik build ${{ github.run_number }}" --notes "Building…"

  build-windows:
    name: Build Windows (installer, portable, CLI)
    needs: release-draft
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Keep the write token out of .git/config while npm/cargo build scripts run.
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install UI deps
        working-directory: app
        run: npm ci
      - name: Build the app with the CLI inside
        working-directory: app
        shell: bash
        run: |
          rm -rf ../target/release/bundle
          npm run package -- --bundles nsis
      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $nsis = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          Copy-Item $nsis.FullName dist/Zorvik-Windows-Setup-x64.exe
          New-Item -ItemType Directory -Force portable | Out-Null
          Copy-Item "target/release/zorvik-desktop.exe" "portable/zorvik-desktop.exe"
          Copy-Item "target/release/zorvik.exe" "portable/zorvik.exe"
          Compress-Archive -Path portable/* -DestinationPath dist/Zorvik-Windows-Portable-x64.zip
          # The command line on its own, for CI machines and servers.
          New-Item -ItemType Directory -Force cli | Out-Null
          Copy-Item "target/release/zorvik.exe", "LICENSE-MIT", "LICENSE-APACHE" cli/
          Compress-Archive -Path cli/* -DestinationPath dist/zorvik-cli-windows-x64.zip
          Get-ChildItem dist | Format-Table Name, Length
      - name: Upload to the draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "build-${{ github.run_number }}" dist/* --clobber

  build-macos:
    name: Build macOS (universal DMG, CLI)
    needs: release-draft
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install UI deps
        working-directory: app
        run: npm ci
      - name: Build the app with the CLI inside (Apple silicon + Intel)
        working-directory: app
        run: |
          rm -rf ../target/universal-apple-darwin/release/bundle
          npm run package -- --target universal-apple-darwin --bundles app,dmg
      - name: Collect
        run: |
          mkdir -p dist
          cp target/universal-apple-darwin/release/bundle/dmg/*.dmg dist/Zorvik-macOS-universal.dmg
          # What the updater installs (signed later, in sign-updates): the app with Zorvik.app at
          # the root, without macOS metadata files, which would break its code signature.
          COPYFILE_DISABLE=1 tar --no-mac-metadata -czf dist/Zorvik-macOS-universal.app.tar.gz \
            -C target/universal-apple-darwin/release/bundle/macos Zorvik.app
          # The command line on its own (Apple silicon and Intel), for CI machines and servers.
          mkdir -p cli
          cp app/src-tauri/binaries/zorvik-universal-apple-darwin cli/zorvik
          cp LICENSE-MIT LICENSE-APACHE cli/
          tar -czf dist/zorvik-cli-macos-universal.tar.gz -C cli zorvik LICENSE-MIT LICENSE-APACHE
          ls -l dist
      - name: Upload to the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "build-${{ github.run_number }}" dist/* --clobber

  build-linux:
    name: Build Linux (deb, rpm, AppImage, CLI)
    needs: release-draft
    # The oldest supported Ubuntu: packages built here run on newer systems (glibc).
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: System libraries (WebKitGTK and friends)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf file
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install UI deps
        working-directory: app
        run: npm ci
      - name: Build the app with the CLI inside
        working-directory: app
        run: |
          rm -rf ../target/release/bundle
          npm run package -- --bundles deb,rpm,appimage
      - name: Collect
        run: |
          mkdir -p dist
          cp target/release/bundle/deb/*.deb dist/Zorvik-Linux-amd64.deb
          cp target/release/bundle/rpm/*.rpm dist/Zorvik-Linux-x86_64.rpm
          cp target/release/bundle/appimage/*.AppImage dist/Zorvik-Linux-x86_64.AppImage
          # The command line on its own, for CI machines and servers (built on the oldest supported glibc).
          mkdir -p cli
          cp target/release/zorvik LICENSE-MIT LICENSE-APACHE cli/
          tar -czf dist/zorvik-cli-linux-x86_64.tar.gz -C cli zorvik LICENSE-MIT LICENSE-APACHE
          ls -l dist
      - name: Upload to the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "build-${{ github.run_number }}" dist/* --clobber

  # The updater key is used only here: a short job in the `release` environment, which only `main`
  # and `v*` tags may use (Settings → Environments), with no build scripts or dependencies of the
  # app running next to it. It signs the three files the app's updater installs and writes
  # latest.json, the file the app reads (docs/ci-release.md, "Updates").
  sign-updates:
    name: Sign the updates
    needs: [release-draft, build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.release-draft.outputs.version }}
      BUILT_AT: ${{ needs.release-draft.outputs.built_at }}
      DRAFT: build-${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Download what the updater installs
        run: |
          set -euo pipefail
          mkdir -p updates
          gh release download "$DRAFT" --dir updates \
            --pattern Zorvik-Windows-Setup-x64.exe --pattern Zorvik-macOS-universal.app.tar.gz --pattern Zorvik-Linux-x86_64.AppImage
          ls -l updates
      - name: Sign and write latest.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # The signer, pinned to the version the app is built with; no install scripts run.
          npm_config_ignore_scripts: "true"
        run: |
          set -euo pipefail
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::warning::No updater key in the release environment: this release has no automatic updates (docs/ci-release.md)."
            exit 0
          fi
          for file in updates/*; do
            # --app-version binds each signature to this version, so an old file can't pass as new.
            npx --yes @tauri-apps/cli@2.12.4 signer sign --app-version "$VERSION" "$file" > /dev/null
          done
          base="https://github.com/$GH_REPO/releases/download/$GITHUB_REF_NAME"
          node .github/scripts/update-manifest.mjs updates "$base" "$VERSION" "$BUILT_AT" "Zorvik $VERSION" > latest.json
          cat latest.json
          gh release upload "$DRAFT" latest.json --clobber

  publish:
    name: Publish the release
    needs: [release-draft, sign-updates]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.release-draft.outputs.version }}
      DRAFT: build-${{ github.run_number }}
    steps:
      - name: Release notes
        run: |
          set -euo pipefail
          : > notes.md
          # The tag's message (an annotated tag) opens the notes.
          ref=$(gh api "repos/$GH_REPO/git/ref/tags/$GITHUB_REF_NAME")
          if [ "$(jq -r .object.type <<< "$ref")" = tag ]; then
            gh api "repos/$GH_REPO/git/tags/$(jq -r .object.sha <<< "$ref")" --jq .message >> notes.md
            printf '\n' >> notes.md
          fi
          cat >> notes.md <<'NOTES'
          ## Downloads
          Each download has the app **and** the `zorvik` command line.

          | System | File | Notes |
          |---|---|---|
          | Windows 10/11 | `Zorvik-Windows-Setup-x64.exe` | Installer for your user (no admin); puts `zorvik` on PATH |
          | Windows 10/11 | `Zorvik-Windows-Portable-x64.zip` | No install: unzip and run `zorvik-desktop.exe` (`zorvik.exe` is beside it) |
          | macOS 11+ (Apple silicon and Intel) | `Zorvik-macOS-universal.dmg` | Drag to Applications. For `zorvik` in a terminal: Settings → AI agents → Add zorvik to PATH |
          | Ubuntu 22.04+ / Debian 12+ | `Zorvik-Linux-amd64.deb` | `sudo apt install ./Zorvik-Linux-amd64.deb` |
          | Fedora / RHEL / openSUSE | `Zorvik-Linux-x86_64.rpm` | `sudo dnf install ./Zorvik-Linux-x86_64.rpm` |
          | Any Linux (x86-64) | `Zorvik-Linux-x86_64.AppImage` | `chmod +x` and run |

          **Only the command line** (for CI machines and servers): `zorvik-cli-windows-x64.zip`, `zorvik-cli-macos-universal.tar.gz`, `zorvik-cli-linux-x86_64.tar.gz`. Unpack and put `zorvik` on your PATH.

          `zorvik-website.tar.gz` is this version's website, which the project publishes; you don't need it.

          The installed app updates itself from here (Settings → Updates): it only reads this project's release list on GitHub and sends nothing about you. The portable zip, .deb and .rpm tell you when a new version is out.

          The builds are not code-signed yet. **Windows:** if SmartScreen appears, choose **More info → Run anyway**. **macOS:** the first open is blocked; open System Settings → Privacy & Security → **Open Anyway**, or run `xattr -dr com.apple.quarantine /Applications/Zorvik.app`.
          NOTES
          # What changed: merged pull requests since the previous release (.github/release.yml),
          # named explicitly so that no other tag is taken for it.
          prev=$(gh api "repos/$GH_REPO/releases?per_page=100" | jq -r --arg current "$GITHUB_REF_NAME" \
            '[.[] | select((.draft | not) and (.prerelease | not) and (.tag_name | startswith("v")) and .tag_name != $current) | .tag_name] | first // empty')
          if [ -n "$prev" ]; then
            printf '\n' >> notes.md
            gh api "repos/$GH_REPO/releases/generate-notes" -f tag_name="$GITHUB_REF_NAME" -f previous_tag_name="$prev" --jq .body >> notes.md
          fi
      - name: Publish
        run: |
          set -euo pipefail
          args=(--tag "$GITHUB_REF_NAME" --latest --title "Zorvik $VERSION")
          # Retried: a transient API error must not leave the draft unpublished.
          for attempt in 1 2 3 4 5; do
            if gh release edit "$DRAFT" "${args[@]}" --draft=false --notes-file notes.md; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1

  # The newest release's files on Cloudflare R2, for networks where GitHub is blocked or slow:
  # the app's updater looks there when it can't reach GitHub, and the website's mirror links
  # point there. Only the newest release is kept, in `zorvik/` under the files' own names (no
  # versions in the addresses): each release replaces the one before, and anything else in the
  # folder is deleted. Served at libreguild.skatech.org and the bucket's r2.dev address. The
  # upload token (an R2 API token with Object Read & Write on this bucket only) lives in the
  # `release` environment as R2_ACCOUNT_ID, R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY; without
  # them the job warns and mirrors nothing. A failed run leaves the GitHub release as it is: run
  # the job again.
  mirror:
    name: Mirror to R2
    needs: [release-draft, publish]
    # The project's own mirror: a copy of the repository elsewhere skips this job.
    if: github.repository == 'LibreGuild/zorvik'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    concurrency:
      group: mirror
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUCKET: s3://libreguild/zorvik
    steps:
      # What is mirrored is what GitHub has, downloaded from the published release.
      - name: Release files
        id: files
        run: |
          set -euo pipefail
          # The mirror follows GitHub's latest release: building an older tag again must not
          # put that release there.
          latest=$(gh release view --json tagName --jq .tagName)
          if [ "$latest" != "$GITHUB_REF_NAME" ]; then
            echo "::notice::$GITHUB_REF_NAME is not the latest release ($latest): the mirror stays as it is."
            echo "mirror=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh release download "$GITHUB_REF_NAME" --dir dist
          # The release's website is for pages.yml, not for people.
          rm -f dist/zorvik-website.tar.gz
          ls -l dist
          echo "mirror=true" >> "$GITHUB_OUTPUT"
      - name: Upload
        id: upload
        if: steps.files.outputs.mirror == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_DEFAULT_REGION: auto
          # R2 does not take the newer default checksum headers of the AWS CLI.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          set -euo pipefail
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ] || [ -z "$R2_ACCOUNT_ID" ]; then
            echo "::warning::No R2 upload token in the release environment (R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY): this release is not mirrored."
            exit 0
          fi
          export AWS_ENDPOINT_URL="https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          # The files replace the last release's under the same names, so nothing may keep an
          # old copy (no-cache: asked for again each time). Whatever else is in the folder goes.
          aws s3 sync dist "$BUCKET/" --delete --no-progress \
            --exclude latest.json --cache-control no-cache
          # `latest.json` goes last: the files it names are in place when the updater reads it.
          if [ -f dist/latest.json ]; then
            aws s3 cp dist/latest.json "$BUCKET/latest.json" --no-progress \
              --cache-control no-cache --content-type application/json
          else
            # A release without automatic updates: no list of an older one stays behind.
            aws s3 rm "$BUCKET/latest.json" || true
          fi
          echo "done=true" >> "$GITHUB_OUTPUT"
      - name: Check the mirrors
        if: steps.upload.outputs.done == 'true'
        run: |
          set -euo pipefail
          # Every file answers at both addresses, and the update list is this release's.
          for host in https://libreguild.skatech.org https://pub-6c540d377bd4404f87ff33fb14c18c21.r2.dev; do
            for file in dist/*; do
              curl -fsSI -o /dev/null --retry 3 "$host/zorvik/$(basename "$file")"
            done
            if [ -f dist/latest.json ]; then
              # The new list may take a moment to show: a few tries before it counts as wrong.
              for attempt in 1 2 3 4 5 6; do
                if curl -fsS "$host/zorvik/latest.json" | cmp -s - dist/latest.json; then
                  break
                fi
                if [ "$attempt" = 6 ]; then
                  echo "::error::$host/zorvik/latest.json is not this release's"
                  exit 1
                fi
                sleep 10
              done
            fi
            echo "$host serves $GITHUB_REF_NAME"
          done

  # The main website shows the latest release's docs. It is built here, from this release's
  # own code, and attached to the release as zorvik-website.tar.gz; pages.yml only downloads
  # and publishes it, so the website workflow never runs a release's code (docs/ci-release.md).
  release-website:
    name: Build this release's website
    needs: [release-draft, publish]
    runs-on: ubuntu-latest
    # Read-only: the site's build runs npm packages.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/pages/package-lock.json
      - name: Build
        working-directory: docs/pages
        env:
          # The site reads this release's version and sizes from GitHub (it is published now).
          GITHUB_TOKEN: ${{ github.token }}
          SITE_BASE: /zorvik
        run: |
          npm ci
          npm run build
          npm run check
          tar -czf "$RUNNER_TEMP/zorvik-website.tar.gz" -C dist .
      - uses: actions/upload-artifact@v7
        with:
          name: website
          path: ${{ runner.temp }}/zorvik-website.tar.gz
          retention-days: 1

  release-website-publish:
    name: Publish this release's website
    needs: release-website
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: website
      - name: Attach it to the release
        run: gh release upload "$GITHUB_REF_NAME" zorvik-website.tar.gz --clobber
      - name: Refresh the website
        # (A release published with this workflow's token triggers no other workflow by itself.)
        run: gh workflow run pages.yml --ref main || echo "::warning::Could not start the website build"

  discard-draft:
    name: Discard the draft
    # A build failed or the run was cancelled: remove this run's draft (drafts are never public).
    needs: [release-draft, build-windows, build-macos, build-linux, publish]
    if: always() && needs.release-draft.result == 'success' && needs.publish.result != 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
