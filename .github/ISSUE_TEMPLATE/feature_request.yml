name: Feature request
description: Suggest something Zorvik should do.
labels: ["enhancement", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! For open-ended ideas, a [discussion](https://github.com/LibreGuild/zorvik/discussions/categories/ideas) is often the better start.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task or problem behind the request. What is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would help?
      description: How you imagine it working in Zorvik.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds or other tools
      description: How you handle it now, or how another tool does it.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I'd like to help build this.
